# Сборка Sonar на серверах GitHub — Windows, Linux и Android.
# Ставите тег (v1.2.0) или публикуете релиз — через 10–20 минут в нём три файла:
#   Sonar-1.2.0.zip (Windows), Sonar-1.2.0-linux-x86_64.tar.gz (Linux), Sonar-1.2.0.apk (Android).
# Вручную: вкладка Actions → «Сборка Sonar» → Run workflow (архивы — в Artifacts).
name: Сборка Sonar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # чтобы выложить релиз

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: dist/Sonar-*.zip
          - os: ubuntu-22.04        # старая glibc — Linux-сборка пойдёт и на системах постарше
            archive: dist/Sonar-*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Deno (нужен для YouTube) — сборщик положит его рядом с программой
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Библиотеки Qt для сборки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3

      - name: Общий сервер Navidrome (из секрета, если задан)
        shell: bash
        env:
          SHARED: ${{ secrets.SHARED_NAVIDROME }}
        run: |
          if [ -n "$SHARED" ]; then
            printf '%s' "$SHARED" > shared_navidrome.json
            echo "общий сервер будет встроен"
          else
            echo "секрета SHARED_NAVIDROME нет — собираю без общего сервера"
          fi

      - name: Сборка
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
        run: python build.py

      - name: Убрать пароль общего сервера
        if: always()
        shell: bash
        run: rm -f shared_navidrome.json

      - name: Архив в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-${{ runner.os }}
          path: ${{ matrix.archive }}

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ключ подписи (из секретов — один и тот же для всех версий)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sonar.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/sonar.jks" >> "$GITHUB_ENV"
            echo "ключ подписи найден"
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_B64 — APK подписан временным ключом, обновиться поверх такой сборки нельзя"
          fi

      - name: Сборка APK
        shell: bash
        env:
          SONAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SHARED_NAVIDROME: ${{ secrets.SHARED_NAVIDROME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SONAR_REPO: ${{ github.repository }}
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          VER="${SONAR_VERSION#v}"; [ -n "$VER" ] || VER="$(date +%Y%m%d)"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Sonar-$VER.apk"
          ls -la dist

      - name: APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-Android
          path: dist/Sonar-*.apk

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sonar-*.apk
          
